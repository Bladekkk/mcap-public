version: '3.8'

services:
  mcap:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - mcap-data:/root/.mcap
    environment:
      - MC_SERVER_PORT=8080
      - MC_RCON_PASSWORD=${RCON_PASSWORD:-change_me_in_production}
      - MC_MODRINTH_TOKEN=${MODRINTH_TOKEN:-}
      - MC_CURSEFORGE_KEY=${CURSEFORGE_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/servers"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mcap-data:
